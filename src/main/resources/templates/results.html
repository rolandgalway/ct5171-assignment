<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">

<h1>Search Results</h1>

<!-- If no results -->
<div th:if="${#lists.isEmpty(results)}">
    <p><strong>No petitions found for your search.</strong></p>
</div>

<!-- If results exist -->
    <ul>
        <li class="petition-title" th:each="p, iter : ${results}">
            <a th:href="@{|/petition/${indexes[iter.index]}|}"
               th:text="${p.title}">
            </a>
        </li>
    </ul>

<br>
<a class="btn" th:href="@{/search}">Search Again</a><br>
<a class="btn-secondary" th:href="@{/}">Back to Home</a>
</div>
</body>
</html>
