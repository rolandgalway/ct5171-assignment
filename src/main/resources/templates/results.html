<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>
</head>
<body>

<h1>Search Results</h1>

<!-- If no results -->
<div th:if="${#lists.isEmpty(results)}">
    <p><strong>No petitions found for your search.</strong></p>
</div>

<!-- If results exist -->
<ul th:if="${!#lists.isEmpty(results)}">
    <li th:each="p, iter : ${results}">
        <a th:href="@{|/petition/${iter.index}|}" th:text="${p.title}"></a>
    </li>
</ul>

<br>
<a th:href="@{/search}">Search Again</a><br>
<a th:href="@{/}">Back to Home</a>

</body>
</html>
