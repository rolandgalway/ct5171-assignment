<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Petition</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">

<h1>Create a New Petition</h1>

<form th:action="@{/submit}" method="post">
    <label>Petition Title:</label><br>
    <input type="text" name="title" required><br><br>

    <label>Description:</label><br>
    <textarea name="description" rows="6" required></textarea><br><br>

    <button type="submit">Submit Petition</button>
</form>

<br>
<a class="btn-secondary" th:href="@{/}">Back to Home</a>
</div>
</body>
</html>
