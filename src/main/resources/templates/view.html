<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${petition.title}">Petition</title>
</head>
<body>

<h1 th:text="${petition.title}"></h1>
<p th:text="${petition.description}"></p>

<h2>Signatures</h2>

<ul>
    <li th:each="s : ${petition.signatures}">
        <strong th:text="${s.name}"></strong> - <span th:text="${s.email}"></span>
    </li>
</ul>

<hr>

<h2>Sign this petition</h2>

<form th:action="@{'/petition/' + ${index} + '/sign'}" method="post">
    <label>Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <button type="submit">Sign Petition</button>
</form>

<br>
<a href="@{/petitions}">Back to all petitions</a>

</body>
</html>
