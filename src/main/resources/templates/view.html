<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Petition</title>
</head>
<body>

<h1 th:text="${petition.title}"></h1>
<p th:text="${petition.description}"></p>

<h3>Signatures</h3>
<ul>
    <li th:each="s : ${petition.signatures}" th:text="${s}"></li>
</ul>

<br>
<a th:href="@{|/petition/${petition.id}/sign|}">Sign this Petition</a>

<br><br>
<a href="/all">Back to All</a>
<br>
<a href="/">Back Home</a>

</body>
</html>
