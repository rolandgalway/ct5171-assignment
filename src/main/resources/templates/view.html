<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${petition.title}">Petition</title>
    <link rel="stylesheet" th:href="@{/style.css(v=${T(java.lang.System).currentTimeMillis()})}">
</head>
<body>
<div class="container">

<h1 th:text="${petition.title}"></h1>
<p th:text="${petition.description}"></p>

<h2>Signatures</h2>

<ul>
    <li th:each="s : ${petition.signatures}">
        <strong th:text="${s.name}"></strong> - <span th:text="${s.email}"></span>
    </li>
</ul>

<hr>

<h2>Sign this petition</h2>

<form th:action="@{'/petition/' + ${index} + '/sign'}" method="post">
    <label>Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <button type="submit">Sign Petition</button>
</form>

<br>
<a class="btn-secondary" th:href="@{/petitions}">Back to All Petitions</a>
</div>
</body>
</html>
