<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Petitions</title>
</head>
<body>
<h1>All Petitions</h1>

<ul>
    <li th:each="p, iter : ${petitions}">
        <a th:href="@{|/petition/${iter.index}|}"
           th:text="${p.title}">Petition</a>
    </li>
</ul>

<br>
<a th:href="@{/}">Back to Home</a>

</body>
</html>
