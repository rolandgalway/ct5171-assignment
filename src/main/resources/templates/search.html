<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Petitions</title>
    <link rel="stylesheet" th:href="@{/style.css(v=${T(java.lang.System).currentTimeMillis()})}">
</head>
<body>
<div class="container">

<h1>Search Petitions</h1>

<form th:action="@{/search/results}" method="get">

    <input type="text" name="keyword" required>
    <button type="submit">Search</button>
</form>

<br>
<a class="btn-secondary" th:href="@{/}">Back to Home</a>
</div>
</body>
</html>
